<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>add foyer</title>
  </head>
  <body>
<div class="container">
    <h2>Add New Foyer</h2>
    <form (ngSubmit)="saveFoyer()">
      <div class="mb-3">
        <label for="nomFoyer" class="form-label">Foyer Name</label>
        <input type="text" id="nomFoyer" [(ngModel)]="foyer.nomFoyer" name="nomFoyer" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="capaciteFoyer" class="form-label">Capacity</label>
        <input type="number" id="capaciteFoyer" [(ngModel)]="foyer.capaciteFoyer" name="capaciteFoyer" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</body>
</html>
