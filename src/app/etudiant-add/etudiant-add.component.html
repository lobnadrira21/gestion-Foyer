<h2>Ajouter un Étudiant</h2>
<form (submit)="addEtudiant()">
  <div class="form-group">
    <label>Nom</label>
    <input [(ngModel)]="newEtudiant.nomEtudiant" name="nom" class="form-control" required />
  </div>
  <div class="form-group">
    <label>Prénom</label>
    <input [(ngModel)]="newEtudiant.prenomEtudiant" name="prenom" class="form-control" required />
  </div>
  <div class="form-group">
    <label>CIN</label>
    <input type="number" [(ngModel)]="newEtudiant.cinEtudiant" name="cin" class="form-control" required />
  </div>

  <button type="submit" class="btn btn-primary">Ajouter</button>
</form>
